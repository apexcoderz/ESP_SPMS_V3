[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ═══════════════════════════════════════════════════════════════
; KONFIGURASI LIBRARY LOKAL
; ═══════════════════════════════════════════════════════════════
lib_extra_dirs = External_libraries/libraries

; Mode "deep+" agar PlatformIO bisa mendeteksi library yang saling
; ketergantungan (nested includes) di folder lokal dengan benar.
lib_ldf_mode = deep+

; ═══════════════════════════════════════════════════════════════
; KONFIGURASI FILE SISTEM
; ═══════════════════════════════════════════════════════════════
; Menggunakan partisi kustom 
board_build.partitions = partitions-4MB.csv 

; ═══════════════════════════════════════════════════════════════
; KEAMANAN (SECRETS)
; ═══════════════════════════════════════════════════════════════
; Load file rahasia
extra_configs = secrets.ini

; Inject variabel ke C++
build_flags = 
    '-D MQTT_BROKER="${secrets.mqtt_broker}"'
    '-D MQTT_PORT=${secrets.mqtt_port}'
    '-D MQTT_USER="${secrets.mqtt_user}"'
    '-D MQTT_PASSWORD="${secrets.mqtt_pass}"'
    '-D MQTT_TOPIC_PUB="${secrets.mqtt_topic}"'